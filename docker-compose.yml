version: "3.9"

services:
  # ── PostgreSQL Database ────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: cxhub_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cxhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cxhub_pass}
      POSTGRES_DB: ${POSTGRES_DB:-cxhub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cxhub} -d ${POSTGRES_DB:-cxhub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Database Migration Runner ──────────────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cxhub_migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cxhub}:${POSTGRES_PASSWORD:-cxhub_pass}@db:5432/${POSTGRES_DB:-cxhub}
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  # ── Seed Runner ────────────────────────────────────────────────────────────
  seed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cxhub_seed
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cxhub}:${POSTGRES_PASSWORD:-cxhub_pass}@db:5432/${POSTGRES_DB:-cxhub}
    command: ["python", "-m", "scripts.seed"]
    restart: "no"

  # ── FastAPI Application ────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cxhub_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cxhub}:${POSTGRES_PASSWORD:-cxhub_pass}@db:5432/${POSTGRES_DB:-cxhub}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-use-openssl-rand-hex-32}
      DEBUG: ${DEBUG:-false}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - ./logs:/app/logs

volumes:
  postgres_data:
    driver: local
